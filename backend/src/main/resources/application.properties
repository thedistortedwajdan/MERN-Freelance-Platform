spring.application.name=gigpilot
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:5000}

spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/gigpilot}
spring.data.mongodb.auto-index-creation=true

# --- auth
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-minutes=30
app.jwt.refresh-days=14
# Password-reset / email-verification tokens are written to the server log until a mailer exists.
# Dev only: never enable this in production.
app.auth.log-tokens=${LOG_AUTH_TOKENS:false}
# Optional bootstrap admin, created on startup when both are set
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Administrator}

# --- rate limiting (login/register/forgot-password), per client IP
app.rate-limit.auth-max=10
app.rate-limit.window-seconds=60

# --- cors
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- file uploads
app.storage.dir=${STORAGE_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# --- scheduled jobs
app.expiry.interval-ms=3600000

# --- caching (public profiles)
spring.cache.type=caffeine
spring.cache.cache-names=publicProfiles
spring.cache.caffeine.spec=expireAfterWrite=30s,maximumSize=1000

# --- ops
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
